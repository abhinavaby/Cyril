<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Header Example</title>
    <style>
        /* Basic Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; }

        /* Header Styling */
        header {
            background-color: #282828;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* YouTube Button Styling */
        .yt-button {
            background-color: #FF0000;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .yt-button:hover { background-color: #CC0000; }

        /* Main Content Section */
        .container {
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        /* Responsive Video Container */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <!-- Open YouTube in a new tab -->
        <a href="https://www.youtube.com" target="_blank" class="yt-button">Open YouTube</a>
    </header>

    <div class="container">
        <h2>Watch the Featured Video</h2>
        
        <!-- Embedded Responsive Video -->
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
